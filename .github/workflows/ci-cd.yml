name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  debug:
    name: Debug CI Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Print environment info
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== NPM version ==="
          npm --version
          echo "=== Workspace dirs ==="
          ls -la apps/
          echo "=== admin-web package.json exists? ==="
          ls -la apps/admin-web/package.json
          echo "=== admin-web node_modules exists? ==="
          ls -la apps/admin-web/node_modules/.package-lock.json 2>&1 || echo "not installed yet"
      - name: Install root deps
        run: npm install
      - name: Install admin-web deps
        run: cd apps/admin-web && npm install
      - name: Type check admin-web
        run: cd apps/admin-web && npx tsc --noEmit
      - name: Build admin-web
        run: cd apps/admin-web && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
