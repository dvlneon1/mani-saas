name: Diagnose Build

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Check env vars
        run: |
          echo "=== Checking Firebase env vars ==="
          echo "API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY != '' && 'SET' || 'MISSING' }}"
          echo "AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN != '' && 'SET' || 'MISSING' }}"
          echo "PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID != '' && 'SET' || 'MISSING' }}"
          echo "STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET != '' && 'SET' || 'MISSING' }}"
          echo "MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID != '' && 'SET' || 'MISSING' }}"
          echo "APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID != '' && 'SET' || 'MISSING' }}"
          echo "MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID != '' && 'SET' || 'MISSING' }}"
      - name: Install root deps
        run: npm install --legacy-peer-deps
      - name: Install admin-web deps
        run: cd apps/admin-web && npm install --legacy-peer-deps
      - name: Build with verbose logging
        run: cd apps/admin-web && npx next build --debug
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
